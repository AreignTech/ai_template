<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Driftwave — flow field playground</title>
<style>
  :root { --ink: #e9e4d8; --sand: #d8c9a8; --bg: #100f0d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(8,8,7,.55) 100%);
  }
  .panel {
    position: fixed; left: 20px; bottom: 20px; width: 300px; z-index: 2;
    background: rgba(20,19,15,.82); border: 1px solid rgba(216,201,168,.14);
    border-radius: 14px; padding: 16px 18px 14px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font: 12px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
  }
  .panel h1 {
    margin: 0 0 12px; font-size: 10px; font-weight: 600;
    letter-spacing: .22em; text-transform: uppercase; color: rgba(233,228,216,.55);
  }
  .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .row label { flex: 0 0 74px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: rgba(233,228,216,.65); }
  .row output { flex: 0 0 62px; text-align: right; font: 11px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--sand); }
  input[type="range"] { flex: 1; accent-color: var(--sand); height: 18px; }
  input[type="number"] {
    flex: 1; background: rgba(0,0,0,.35); color: var(--ink); border: 1px solid rgba(216,201,168,.18);
    border-radius: 8px; padding: 5px 8px; font: 13px/1.2 ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  select, input[type="color"] {
    background: rgba(0,0,0,.35); color: var(--ink); border: 1px solid rgba(216,201,168,.18);
    border-radius: 8px; padding: 4px 6px; font: 11px ui-sans-serif, system-ui, sans-serif;
  }
  input[type="color"] { flex: 0 0 44px; height: 26px; padding: 2px; }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  button {
    flex: 1; background: transparent; color: var(--sand); cursor: pointer;
    border: 1px solid rgba(216,201,168,.35); border-radius: 9px; padding: 7px 0;
    font: 600 10px/1 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .16em; text-transform: uppercase;
    transition: background .15s ease, border-color .15s ease;
  }
  button:hover { background: rgba(216,201,168,.1); border-color: rgba(216,201,168,.6); }
  .hint { margin-top: 10px; font-size: 10px; line-height: 1.5; color: rgba(233,228,216,.38); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="vignette"></div>

<div class="panel">
  <h1>Driftwave · sound as a slow current</h1>

  <div class="row">
    <label for="seed">Seed</label>
    <input id="seed" type="number" min="1" max="999999" step="1" value="1847" />
  </div>
  <div class="row">
    <label for="speed">Speed</label>
    <input id="speed" type="range" min="0" max="3" step="0.05" value="1" />
    <output id="speedOut">1.00×</output>
  </div>
  <div class="row">
    <label for="lines">Lines</label>
    <input id="lines" type="range" min="400" max="6000" step="100" value="2600" />
    <output id="linesOut">2600</output>
  </div>
  <div class="row">
    <label for="preset">Colour</label>
    <select id="preset">
      <option value="#d8c9a8" selected>Sand</option>
      <option value="#e9e4d8">Bone</option>
      <option value="#c98f5f">Copper</option>
      <option value="#9fb8a8">Seafoam</option>
      <option value="#c7cfd9">Moonlight</option>
      <option value="custom">Custom…</option>
    </select>
    <input id="color" type="color" value="#d8c9a8" />
  </div>

  <div class="btns">
    <button id="dice" type="button">Roll seed</button>
    <button id="save" type="button">Save PNG</button>
  </div>
  <p class="hint">Same seed → same artwork. Move the pointer over the field; the current bends around it. When you find one you like, tell me the seed.</p>
</div>

<script>
"use strict";

/* ---------- seeded randomness ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* seeded 3D Perlin noise (improved-Perlin, seeded permutation table) */
function makeNoise(rand) {
  const perm = new Uint8Array(512);
  const base = new Uint8Array(256);
  for (let i = 0; i < 256; i++) base[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = (rand() * (i + 1)) | 0;
    const t = base[i]; base[i] = base[j]; base[j] = t;
  }
  for (let i = 0; i < 512; i++) perm[i] = base[i & 255];
  const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  const lerp = (t, a, b) => a + t * (b - a);
  const grad = (hash, x, y, z) => {
    const h = hash & 15;
    const u = h < 8 ? x : y;
    const v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
    return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
  };
  return function (x, y, z) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = fade(x), v = fade(y), w = fade(z);
    const A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z;
    const B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;
    return lerp(w,
      lerp(v,
        lerp(u, grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z)),
        lerp(u, grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z))),
      lerp(v,
        lerp(u, grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1)),
        lerp(u, grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1))));
  };
}

/* ---------- engine ---------- */
const BG = "#100f0d";
const MAX_LINES = 6000;
const NOISE_SCALE = 0.0018;
const BUCKETS = [
  { a: 0.05, w: 0.7 },
  { a: 0.07, w: 0.8 },
  { a: 0.10, w: 0.9 },
  { a: 0.14, w: 1.15 },
];

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;

const px = new Float32Array(MAX_LINES);
const py = new Float32Array(MAX_LINES);
const plife = new Float32Array(MAX_LINES);
const psp = new Float32Array(MAX_LINES);
const pbucket = new Uint8Array(MAX_LINES);

let seed = 1847, speed = 1, lineCount = 2600, lineColor = "#d8c9a8";
let noise = null, fieldRnd = null, spawnRnd = null, t = 0;
const pointer = { x: 0, y: 0, active: false };

function hexToRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

function spawn(i) {
  px[i] = spawnRnd() * W;
  py[i] = spawnRnd() * H;
  plife[i] = 80 + spawnRnd() * 280;
  psp[i] = 0.7 + spawnRnd() * 0.85;
  pbucket[i] = (spawnRnd() * BUCKETS.length) | 0;
}

function reset() {
  noise = makeNoise(mulberry32((seed ^ 0x9e3779b9) >>> 0));
  spawnRnd = mulberry32(seed >>> 0);
  t = 0;
  for (let i = 0; i < MAX_LINES; i++) spawn(i);
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  reset();
}

function step() {
  t += 0.0016 * speed;
  // trail decay
  ctx.fillStyle = hexToRgba(BG, 0.05);
  ctx.fillRect(0, 0, W, H);

  const mv = 1.2 * speed;
  const MR = 170, MR2 = MR * MR;

  for (let b = 0; b < BUCKETS.length; b++) {
    ctx.strokeStyle = hexToRgba(lineColor, BUCKETS[b].a);
    ctx.lineWidth = BUCKETS[b].w;
    ctx.beginPath();
    for (let i = 0; i < lineCount; i++) {
      if (pbucket[i] !== b) continue;
      const x = px[i], y = py[i];

      const a = noise(x * NOISE_SCALE, y * NOISE_SCALE, t) * 2.2;
      let vx = Math.cos(a) * 0.85 + 0.5;   // rightward tidal drift
      let vy = Math.sin(a) * 0.85;

      if (pointer.active) {
        const dx = x - pointer.x, dy = y - pointer.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < MR2 && d2 > 0.01) {
          const d = Math.sqrt(d2);
          const f = 1 - d / MR;
          const push = f * f * 1.9;
          vx += (dx / d) * push;
          vy += (dy / d) * push;
          vx += (-dy / d) * f * 0.7;       // gentle swirl around the cursor
          vy += (dx / d) * f * 0.7;
        }
      }

      const m = Math.sqrt(vx * vx + vy * vy) || 1;
      const s = mv * psp[i];
      let nx = x + (vx / m) * s;
      let ny = y + (vy / m) * s;

      ctx.moveTo(x, y);
      ctx.lineTo(nx, ny);

      plife[i] -= 1;
      if (plife[i] <= 0 || nx < -24 || nx > W + 24 || ny < -24 || ny > H + 24) {
        spawn(i);
      } else {
        px[i] = nx; py[i] = ny;
      }
    }
    ctx.stroke();
  }
}

/* ---------- UI ---------- */
const $ = (id) => document.getElementById(id);

$("seed").addEventListener("change", (e) => {
  seed = Math.max(1, Math.min(999999, parseInt(e.target.value, 10) || 1));
  e.target.value = seed;
  reset();
});
$("speed").addEventListener("input", (e) => {
  speed = parseFloat(e.target.value);
  $("speedOut").textContent = speed.toFixed(2) + "×";
});
$("lines").addEventListener("input", (e) => {
  lineCount = parseInt(e.target.value, 10);
  $("linesOut").textContent = lineCount;
});
function applyColor(hex) {
  lineColor = hex;
  $("color").value = hex;
}
$("preset").addEventListener("change", (e) => {
  if (e.target.value !== "custom") applyColor(e.target.value);
});
$("color").addEventListener("input", (e) => {
  lineColor = e.target.value;
  const match = [...$("preset").options].find((o) => o.value === lineColor);
  $("preset").value = match ? match.value : "custom";
});
$("dice").addEventListener("click", () => {
  seed = 1 + Math.floor(Math.random() * 999999);
  $("seed").value = seed;
  reset();
});
$("save").addEventListener("click", () => {
  const link = document.createElement("a");
  link.download = `driftwave-seed-${seed}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
});

window.addEventListener("resize", resize);
canvas.addEventListener("pointermove", (e) => {
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true;
});
canvas.addEventListener("pointerleave", () => { pointer.active = false; });

/* ---------- boot ---------- */
resize();

const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if (reduced) {
  for (let i = 0; i < 220; i++) step();   // static composed frame
} else {
  (function loop() {
    step();
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
